services:
  postgres:
    image: postgres:16-alpine
    container_name: mmogame-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Server/.env}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nakama"]
      interval: 5s
      timeout: 3s
      retries: 10
    expose:
      - "5432"

  nakama:
    image: heroiclabs/nakama:3.24.0
    container_name: mmogame-nakama
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up
          --database.address nakama:${POSTGRES_PASSWORD}@postgres:5432/nakama
        && exec /nakama/nakama
          --config /nakama/data/local.yml
          --database.address nakama:${POSTGRES_PASSWORD}@postgres:5432/nakama
          --session.encryption_key ${SESSION_ENCRYPTION_KEY:?set SESSION_ENCRYPTION_KEY in Server/.env}
          --session.refresh_encryption_key ${SESSION_REFRESH_ENCRYPTION_KEY:?set SESSION_REFRESH_ENCRYPTION_KEY in Server/.env}
          --socket.server_key ${SERVER_KEY:?set SERVER_KEY in Server/.env}
          --console.password ${CONSOLE_PASSWORD:?set CONSOLE_PASSWORD in Server/.env}
    volumes:
      - ./nakama:/nakama/data
    ports:
      - "7349:7349"   # gRPC API
      - "7350:7350"   # HTTP API (REST + WebSocket)
      - "7351:7351"   # Console UI
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
